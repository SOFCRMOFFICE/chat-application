<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resource Requisition Form (RRF)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    .error-text { color: #dc3545; font-size: 0.85rem; }
    .btnSubmit, .btnRefresh { border: 0; padding: 0.5rem 1rem; border-radius: 0.375rem; }
    .btnSubmit { background: #0d6efd; color: #fff; }
    .btnRefresh { background: #6c757d; color: #fff; }
  </style>
</head>
<body class="p-3 bg-light">
  <div class="card">
    <div class="card-header p-2 d-flex justify-content-between">
      <div class="d-flex align-items-center mb-0">
        <div class="ms-2 flex-grow-1">
          <h6 class="mb-0 fs-15">Resource Requisition Form (RRF)</h6>
        </div>
      </div>
    </div>
    <div class="card-body p-2">
      <form id="rrfForm" novalidate>
        <div class="row">
          <div class="col-xl-1 col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="jobId">Job ID</label>
            <input id="jobId" name="JobId" type="text" class="form-control" placeholder="Enter Job Id" value="J004" minlength="1" maxlength="6" required autocomplete="off" aria-label="Job Id" title="Job Id" disabled>
          </div>
          <div class="col-xl col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="ddlDepartment">Department <span class="text-danger">*</span></label>
            <select id="ddlDepartment" name="Department" class="form-select" required>
              <option value="">-- Select Department --</option>
              <option value="HR">HR</option>
              <option value="IT">IT</option>
              <option value="Finance">Finance</option>
              <option value="Marketing">Marketing</option>
              <option value="Operations">Operations</option>
              <option value="Admin">Admin</option>
              <option value="Sales">Sales</option>
            </select>
          </div>
          <div class="col-xl col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="ddlPosition">Position Title <span class="text-danger">*</span></label>
            <select id="ddlPosition" name="Positions" class="form-select" multiple required>
              <option value="">All Positions</option>
              <option value="Manager">Manager</option>
              <option value="Team Lead">Team Lead</option>
              <option value="Senior Developer">Senior Developer</option>
              <option value="Developer">Developer</option>
              <option value="HR Executive">HR Executive</option>
              <option value="Accountant">Accountant</option>
              <option value="Marketing Executive">Marketing Executive</option>
              <option value="Sales Executive">Sales Executive</option>
              <option value="Operations Supervisor">Operations Supervisor</option>
            </select>
          </div>
          <div class="col-xl col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="ddlopostionno">No. Of Positions <span class="text-danger">*</span></label>
            <input type="text" id="ddlopostionno" name="NumberOfPosition" class="form-control" placeholder="Enter Number of Positions" maxlength="10" title="No. Of Positions" pattern="\d+" required inputmode="numeric" autocomplete="off" aria-label="Number of Positions">
          </div>
          <div class="col-xl col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="ddlJoinTimeline">Expected Joining Timeline <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="ddlJoinTimeline" placeholder="DD-MM-YYYY to DD-MM-YYYY" required />
          </div>
          <div class="col-xl col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="ddlWorkExperience">Minimum Work Experience <span class="text-danger">*</span></label>
            <select id="ddlWorkExperience" name="MinimumWorkExperience" class="form-select" required>
              <option value="">-- Select Experience (Years) --</option>
              <option value="0">Fresher</option>
              <option value="1">1 Year</option>
              <option value="2">2 Years</option>
              <option value="3">3 Years</option>
              <option value="4">4 Years</option>
              <option value="5">5 Years</option>
              <option value="10">10 Years</option>
              <option value="15">15 Years</option>
              <option value="20">20 Years</option>
              <option value="25">25 Years</option>
              <option value="30">30 Years</option>
            </select>
          </div>
          <div class="col-xl col-lg-3 col-md-4 col-sm-6 mb-2">
            <label class="form-label" for="ddlQualification">Minimum Qualification <span class="text-danger">*</span></label>
            <select id="ddlQualification" name="Qualifications" class="form-select" multiple required>
              <option value="">All Qualifications</option>
              <option value="10th">10th / SSC</option>
              <option value="12th">12th / HSC</option>
              <option value="Diploma">Diploma</option>
              <option value="ITI">ITI</option>
              <option value="Graduate">Graduate</option>
              <option value="Post Graduate">Post Graduate</option>
              <option value="B.E / B.Tech">B.E / B.Tech</option>
              <option value="M.E / M.Tech">M.E / M.Tech</option>
              <option value="BCA">BCA</option>
              <option value="MCA">MCA</option>
              <option value="MBA">MBA</option>
              <option value="PhD">PhD</option>
            </select>
          </div>
          <div class="col-xl-12 col-sm-6 mb-2">
            <label class="form-label" for="jobDescription">Job Description / Key Responsibilities <span class="text-danger">*</span></label>
            <textarea rows="2" id="jobDescription" class="form-control" placeholder="Enter Job Description" maxlength="500" required></textarea>
          </div>
          <div class="col-xl-4 col-lg-6 mb-2">
            <label class="form-label" for="Skills">Specialized Skills Required</label>
            <input id="Skills" name="Skills" type="text" class="form-control" placeholder="Enter Skills" minlength="1" maxlength="100" required autocomplete="off">
          </div>
          <div class="col-xl-4 col-lg-6 mb-2">
            <label class="form-label" for="ddlHeringLoction">Hiring Location</label>
            <input id="ddlHeringLoction" name="HiringLocation" type="text" class="form-control" placeholder="Hiring Location City" minlength="1" maxlength="50" required autocomplete="off" pattern="[A-Za-z\s]+">
          </div>
          <div class="col-xl-4 col-lg-6 mb-2">
            <label class="form-label" for="AttachRRF">Attach RRF (Resource Requisition Form)</label>
            <input type="file" id="AttachRRF" class="form-control" accept=".pdf,.doc,.docx" />
          </div>
          <div class="col-12 mb-2 d-flex gap-2">
            <button id="submitRRF" type="submit" class="btnSubmit">Submit</button>
            <button type="reset" class="btnRefresh">Reset</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script>
    $(function () {
      $.validator.addMethod("dateRange", function (value, element) {
        if (!value) return false;
        return /^\d{2}-\d{2}-\d{4}\s+to\s+\d{2}-\d{2}-\d{4}$/.test(value.trim());
      }, "Use format: DD-MM-YYYY to DD-MM-YYYY");

      $.validator.addMethod("multiRequired", function (value, element) {
        const selected = $(element).val() || [];
        return selected.length > 0 && !selected.includes("");
      }, "Please select at least one option.");

      $.validator.addMethod("lettersOnly", function (value, element) {
        return this.optional(element) || /^[A-Za-z\s]+$/.test(value);
      }, "Only letters and spaces are allowed.");

      $("#rrfForm").validate({
        errorClass: "error-text",
        errorElement: "div",
        highlight: function (element) {
          $(element).addClass("is-invalid");
        },
        unhighlight: function (element) {
          $(element).removeClass("is-invalid");
        },
        rules: {
          Department: { required: true },
          Positions: { multiRequired: true },
          NumberOfPosition: { required: true, digits: true, min: 1 },
          MinimumWorkExperience: { required: true },
          Qualifications: { multiRequired: true },
          Skills: { required: true, minlength: 2, maxlength: 100 },
          HiringLocation: { required: true, lettersOnly: true }
        },
        messages: {
          Department: "Please select a department.",
          Positions: "Please select at least one position.",
          NumberOfPosition: {
            required: "Please enter number of positions.",
            digits: "Only numeric values are allowed.",
            min: "Number of positions must be at least 1."
          },
          MinimumWorkExperience: "Please select minimum work experience.",
          Qualifications: "Please select at least one qualification.",
          Skills: {
            required: "Please enter specialized skills.",
            minlength: "Enter at least 2 characters."
          },
          HiringLocation: {
            required: "Please enter hiring location."
          }
        }
      });

      $("#ddlJoinTimeline").rules("add", {
        required: true,
        dateRange: true,
        messages: {
          required: "Please enter expected joining timeline."
        }
      });

      $("#jobDescription").rules("add", {
        required: true,
        minlength: 10,
        messages: {
          required: "Please enter job description.",
          minlength: "Description should be at least 10 characters long."
        }
      });

      $("#AttachRRF").on("change", function () {
        const file = this.files[0];
        if (!file) return;
        const allowed = ["application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"];
        if (!allowed.includes(file.type)) {
          alert("Please upload only PDF/DOC/DOCX files.");
          this.value = "";
        }
      });
    });
  </script>
</body>
</html>
